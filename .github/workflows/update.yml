# Samples Bay of Palma wind, commits live.json plus the rolling history.json,
# then Direct Uploads site/ to Cloudflare Pages. Git integration is not used:
# free-plan Pages builds from Git are limited, and this repo has no GitHub Pages deploy.
# A Cloudflare Worker cron dispatches this workflow every 5 minutes. The GitHub
# schedule below is only a backup. Data commits use [skip ci] and do not match
# the push paths, so they do not start another run.
name: Update wind data

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Deploy capa-wind-ticker and set its GH_TOKEN secret
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: capa-wind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler-${{ runner.os }}

      - name: Pull latest history
        run: git pull --rebase origin main

      - name: Fetch wind data
        env:
          OBS_ARCHIVE_DIR: /nonexistent
        run: python3 fetch_data.py

      - name: Commit rolling history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/live.json history.json
          if git diff --cached --quiet; then
            echo "No changes to wind history; not committing."
            exit 0
          fi
          # [skip ci] plus the push path filter: this commit must not start another run.
          git commit -m "Update wind history [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Failed to push wind history." >&2
          exit 1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_USER: ${{ secrets.SITE_USER }}
          SITE_PASS: ${{ secrets.SITE_PASS }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; skipping Cloudflare Pages deploy."
            exit 0
          fi
          # wrangler pages deploy looks for ./functions in the working directory
          # (the repo root here), not inside the static directory. functions/_middleware.js
          # must stay at the repo root or it will not be uploaded.
          npx --yes wrangler pages project create capa-wind --production-branch main || true
          deploy_pages() {
            local deploy_out status
            set +e
            deploy_out="$(npx --yes wrangler pages deploy site --project-name=capa-wind --branch=main 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$deploy_out"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            printf '%s\n' "$deploy_out" | grep -q 'Uploading Functions bundle' || {
              echo "::error::Pages Functions bundle was not uploaded."
              exit 1
            }
          }
          deploy_pages

          need_secrets=0
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            need_secrets=1
          else
            listed="$(npx --yes wrangler pages secret list --project-name capa-wind --env production 2>&1 || true)"
            printf '%s\n' "$listed"
            printf '%s\n' "$listed" | grep -q 'SITE_USER' || need_secrets=1
            printf '%s\n' "$listed" | grep -q 'SITE_PASS' || need_secrets=1
          fi
          if [ "$need_secrets" -eq 0 ]; then
            echo "Pages production auth secrets already present; skipping secret update."
            exit 0
          fi
          if [ -z "${SITE_USER}" ] || [ -z "${SITE_PASS}" ]; then
            echo "::notice::GitHub secrets SITE_USER or SITE_PASS are unset. The Pages middleware denies every request until both exist on the project."
            exit 0
          fi
          echo "$SITE_USER" | npx --yes wrangler pages secret put SITE_USER --project-name capa-wind --env production
          echo "$SITE_PASS" | npx --yes wrangler pages secret put SITE_PASS --project-name capa-wind --env production
          deploy_pages

      - name: Deploy ticker worker
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; skipping ticker deploy."
            exit 0
          fi
          npx --yes wrangler deploy
          if [ -z "${GH_DISPATCH_TOKEN}" ]; then
            echo "::notice::GH_DISPATCH_TOKEN is unset. The ticker is deployed but cannot dispatch until that secret is stored as GH_TOKEN."
            exit 0
          fi
          echo -n "$GH_DISPATCH_TOKEN" | npx --yes wrangler secret put GH_TOKEN
