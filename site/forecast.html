<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forecast · CAPA ESP 99</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1F3A">
<link rel="stylesheet" href="assets/brand.css">
<style>
:root{--navy:#0B1F3A;--panel:#13304F;--panel2:#183a5e;--line:#2A4A70;--text:#EAF2FB;--muted:#8FA8C4;--green:#4CAF7D;--red:#E57373;--amber:#F2C14E}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:10px 12px 28px}
h2{font-size:15px;margin:16px 0 8px}h3{font-size:13px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.small{font-size:12px}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.tab{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 12px;font:600 13px inherit}
.tab.on{background:#FFD54F;color:#2a2006;border-color:#FFD54F}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.hero{border:2px solid #FFD54F}.headline{font-size:17px;font-weight:700;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#06121f;margin-right:6px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--panel2);margin:2px 4px 2px 0}
.c-high{background:var(--green);color:#06210f}.c-medium{background:var(--amber);color:#2a2006}.c-low{background:var(--red);color:#2a0606}
table{width:100%;min-width:680px;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600}td:first-child,th:first-child{text-align:left}tr.race td{background:rgba(255,213,79,.07)}
.arr{display:inline-block;width:14px;text-align:center}
ul{margin:4px 0 0;padding-left:18px}li{margin:3px 0}
.chart{width:100%;height:auto;display:block}svg text{fill:var(--muted);font-size:12px}
a{color:#9cc8ff}
@media(max-width:420px){
  .wrap{padding:8px}
  .grid{grid-template-columns:1fr}
}
</style></head><body>
<header class="sitehead">
  <img class="dragon" src="assets/dragon_capa_final_transparent.svg" alt="">
  <div class="sitebar">
    <a class="brand" href="./"><img class="mark" src="assets/capa-logo.svg" alt="" width="36" height="36"><span class="word"><span class="capa">CAPA</span><span class="eye">ESP 99 · Bay of Palma</span></span></a>
    <h1>Forecast</h1>
    <div class="headmeta" id="gen"></div>
  </div>
  <nav class="sitenav" aria-label="Site"><a href="./">Live wind</a><a href="forecast.html" aria-current="page">Forecast</a><a href="playbook.html">Wind playbook</a><a href="./#webcams">Webcams</a></nav>
</header>
<div class="wrap">
<div class="muted small" style="margin:2px 0 6px">Puerto Portals race area · kt, ° true (wind FROM), Madrid time</div>
<div class="tabs" id="tabs"></div><div id="day"></div>
<div class="card small muted" id="src"></div>
</div>
<script>
const RULES='https://github.com/ccarbajal1984/capa-wind/blob/main/docs/KNOWLEDGE.md';
const KT=v=>v==null?'–':v.toFixed(0), esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const spdCol=s=>s==null?'#555':s<6?'#7FB3D5':s<10?'#4CAF7D':s<15?'#F2C14E':s<20?'#F39C5A':'#E57373';
const arrow=d=>d==null?'':`<span class="arr" style="transform:rotate(${d+180}deg)">↑</span>`;
function chart(h){
  const W=900,H=200,L=34,R=40,T=10,B=24,n=h.length;
  const x=i=>L+(n<2?0:i*(W-L-R)/(n-1));
  const mx=Math.max(10,...h.map(r=>r.gst||r.spd||0))*1.1;
  const y=v=>T+(H-T-B)*(1-v/mx), yd=d=>T+(H-T-B)*(d/360);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  let iStart=-1, iEnd=-1;
  h.forEach((r,i)=>{ if(r.time>='11:00' && r.time<='16:00'){ if(iStart<0) iStart=i; iEnd=i; } });
  if(iStart>=0 && iEnd>iStart) s+=`<rect id="racewin" x="${x(iStart)}" y="${T}" width="${x(iEnd)-x(iStart)}" height="${H-T-B}" fill="rgba(255,213,79,.07)"/>`;
  for(let v=0;v<=mx;v+=5)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2A4A70"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  ['N','E','S','W','N'].forEach((c,k)=>s+=`<text x="${W-R+6}" y="${yd(k*90)+4}">${c}</text>`);
  const pl=(k,f)=>h.map((r,i)=>r[k]==null?'':`${x(i)},${f(r[k])}`).filter(Boolean).join(' ');
  s+=`<polyline points="${pl('gst',y)}" fill="none" stroke="#E57373" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=`<polyline points="${pl('spd',y)}" fill="none" stroke="#FFD54F" stroke-width="3"/>`;
  h.forEach((r,i)=>{if(r.dir!=null)s+=`<circle cx="${x(i)}" cy="${yd(r.dir)}" r="4" fill="#64B5F6"/>`;s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${r.time.slice(0,2)}</text>`});
  return s+`<text x="${L}" y="${T+10}" style="fill:#FFD54F">speed</text><text x="${L+44}" y="${T+10}" style="fill:#E57373">gust</text><text x="${L+80}" y="${T+10}" style="fill:#64B5F6">direction (right axis)</text></svg>`;
}
function render(d){
  const g=d.regime,c=d.confidence,s=d.strategy,e=d.expected_observed,a=d.analogs;
  let h=`<div class="card hero"><span class="badge" style="background:${g.color}">${esc(g.name)}</span><span class="badge c-${c.level}">Confidence ${c.level}</span><span class="pill">${esc(s.pattern)}</span><span class="pill">Favoured: ${esc(s.favoured_side)}</span>
  <div class="headline" style="margin-top:8px">${esc(d.headline)}</div><div class="small muted" style="margin-top:4px">Regime basis: ${esc(g.why)}</div></div>`;
  h+=`<div class="card"><h3>AROME timeline 08–20 h (race window shaded)</h3>${chart(d.hourly)}</div>`;
  h+=`<div class="card"><h3>AROME hourly · Portals</h3><table><tr><th>Time</th><th>Speed kt</th><th>Gust kt</th><th>Dir °</th><th></th><th>Temp °C</th><th>Cloud %</th><th>MSLP hPa</th><th>Model</th></tr>`+
  d.hourly.map(r=>`<tr class="${r.time>='11:00'&&r.time<='16:00'?'race':''}"><td>${r.time}</td><td style="color:${spdCol(r.spd)};font-weight:700">${KT(r.spd)}</td><td>${KT(r.gst)}</td><td>${r.dir==null?'–':r.dir.toFixed(0)}</td><td style="text-align:left">${arrow(r.dir)} ${r.compass||''}</td><td>${r.temp==null?'–':r.temp.toFixed(1)}</td><td>${r.cloud==null?'–':r.cloud.toFixed(0)}</td><td>${r.pmsl==null?'–':r.pmsl.toFixed(1)}</td><td class="muted small">${r.src||''}</td></tr>`).join('')+`</table></div>`;
  h+=`<div class="grid"><div class="card"><h3>What the wind will do</h3><ul>${d.interpretation.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  <div class="small muted" style="margin-top:6px">Race hours: ${d.evolution.map(esc).join(' · ')}</div>
  ${e?`<div style="margin-top:6px"><b>Expected open-bay wind: ${e.lo}–${e.hi} kt (mid ${e.mid})</b><div class="small muted">${esc(e.text)}</div></div>`:''}</div>
  <div class="card"><h3>Strategy</h3><ul><li><b>Shifts:</b> ${esc(s.text)}</li>${s.history_bias?`<li>${esc(s.history_bias)}</li>`:''}<li>${esc(s.side_text)}</li><li><b>Start:</b> ${esc(s.start)}</li><li><b>Windward mark:</b> ${esc(s.windward_mark)}</li></ul></div></div>`;
  h+=`<div class="grid"><div class="card"><h3>Confidence · ${c.level}</h3><ul>${c.why.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="card"><h3>Rig · Capa tuning table</h3><table><tr><th>TWS kt</th><th>Rake</th><th>V</th><th>D</th><th>Genoa</th></tr>${d.rig.settings.map(r=>`<tr><td>${r.band}</td><td>${r.rake_cm}</td><td>${r.uppers_V}</td><td>${r.lowers_D}</td><td>${r.genoa}</td></tr>`).join('')}</table><ul class="small">${d.rig.notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="small muted">${esc(d.rig.source)}</div></div></div>`;
  if(a&&a.stats){const st=a.stats,q=o=>o?`${o.median} (q25 ${o.q25}–q75 ${o.q75}, n=${o.n})`:'–';
  h+=`<div class="card"><h3>Historical analogs · ${esc(a.label)}</h3><table><tr><th>Measure</th><th>Value</th></tr>
  <tr><td>AROME Portals 11–16 h mean, kt</td><td>${q(st.arome_spd)}</td></tr><tr><td>SOCIB buoy observed mean, kt</td><td>${q(st.buoy_spd)}</td></tr>
  <tr><td>Buoy strongest hour, kt</td><td>${q(st.buoy_max_hourly)}</td></tr><tr><td>Buoy gust factor</td><td>${q(st.buoy_gust_factor)}</td></tr>
  <tr><td>LEPA airport mean, kt</td><td>${q(st.lepa_spd)}</td></tr><tr><td>Buoy dir 15 h − 11 h, ° (+veer)</td><td>${q(st.buoy_trend_15_minus_11)}</td></tr>
  <tr><td>Buoy dir − AROME dir, °</td><td>${q(st.dir_err_buoy_minus_arome)}</td></tr></table></div>`}
  document.getElementById('day').innerHTML=h;
}
fetch('data/forecast.json',{cache:'no-store'}).then(r=>r.json()).then(F=>{
  document.getElementById('gen').innerHTML='Brief built<br><b>'+new Date(F.generated_utc).toLocaleString('en-GB',{timeZone:'Europe/Madrid',dateStyle:'medium',timeStyle:'short'})+'</b> Madrid';
  const t=document.getElementById('tabs');F.days.forEach((d,i)=>{const b=document.createElement('button');b.className='tab'+(i?'':' on');
   b.textContent=new Date(d.date+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
   b.onclick=()=>{[...t.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render(d)};t.appendChild(b)});
  render(F.days[0]);
  document.getElementById('src').innerHTML='<b>Sources:</b> '+F.sources.map(s=>`<a href="${s.url}">${esc(s.name)}</a>`).join(' · ')+'. Interpretation rules are documented in <a href="'+RULES+'">KNOWLEDGE.md</a>; statements marked (inference) are not yet verified on the water.';
}).catch(()=>{ document.getElementById('day').innerHTML='<div class="card">Forecast brief is not available yet.</div>'; });
</script></body></html>
