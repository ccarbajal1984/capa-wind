# Samples Bay of Palma wind, commits the rolling history, then Direct Uploads
# site/ to Cloudflare Pages. Git integration is not used: free-plan Pages
# builds from Git are limited, and this repo has no GitHub Pages deploy.
name: Update wind data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capa-wind-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest history
        run: git pull --rebase origin main

      - name: Fetch wind data
        run: python fetch_data.py

      - name: Commit rolling history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/live.json site/data/history.json
          if git diff --cached --quiet; then
            echo "No changes to wind history."
            exit 0
          fi
          # [skip ci] plus the absence of a push trigger: this commit must not
          # start another run of this workflow.
          git commit -m "Update wind history [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Failed to push wind history." >&2
          exit 1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is unset; skipping Cloudflare Pages deploy."
            exit 0
          fi
          npx --yes wrangler pages deploy site --project-name=capa-wind --branch=main
